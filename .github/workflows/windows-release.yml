# Builds Planloom.exe + planloom-cli.exe on a Windows runner, proves the
# built executables work, and (for a v* tag) attaches them to a release.
#
# Owner-approved (LAYOUT_PACKAGE_BRIEF section 13).  Nothing is attached
# unless every test step below passed.
#
#   Release a beta:   on the website, Releases -> Draft a new release ->
#                     new tag v5.10.0-beta.1 on this branch -> Publish.
#                     (or: git tag v5.10.0-beta.1 && git push origin v5.10.0-beta.1)
#   Build only:       every push to the working branch, or Actions tab ->
#                     "Windows build" -> Run workflow (exes under Artifacts)

name: Windows build

on:
  push:
    tags: ["v*"]
    branches: ["claude/planloom-session-resume-p10twg"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:            # a website release fires a tag push too: run them one at a time
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.21.0  # 6.11 froze a broken numpy 2.5 (caught by exe_smoke)

      - name: Engine smoke test (source)
        run: python tests/smoke_test.py

      - name: Build executables
        run: python -m PyInstaller rfi_stamper.spec --noconfirm

      - name: Smoke test the built executables
        run: python tests/exe_smoke.py dist\planloom-cli.exe dist\Planloom.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item dist\Planloom.exe, dist\planloom-cli.exe pkg\
          Copy-Item BETA_TESTERS.md pkg\READ_ME_FIRST.md
          Compress-Archive -Path pkg\* -DestinationPath Planloom-Windows.zip -Force
          Get-FileHash dist\Planloom.exe, dist\planloom-cli.exe, Planloom-Windows.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content SHA256SUMS.txt

      - name: Keep build files
        uses: actions/upload-artifact@v4
        with:
          name: Planloom-Windows
          path: |
            dist/Planloom.exe
            dist/planloom-cli.exe
            Planloom-Windows.zip
            SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        # a tag push and a website release both fire; one run attaches,
        # the other then finds the files already there and replaces them
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @("dist/Planloom.exe", "dist/planloom-cli.exe",
                     "Planloom-Windows.zip", "SHA256SUMS.txt")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # release published on the website: attach, keep its notes if any
            gh release upload $tag @files --clobber
            $body = gh release view $tag --json body --jq .body
            if (-not $body) { gh release edit $tag --notes-file BETA_TESTERS.md }
          } else {
            $a = @($tag) + $files + @("--title", "Planloom $tag",
                                      "--notes-file", "BETA_TESTERS.md")
            if ($tag -match "-") { $a += "--prerelease" }   # v5.10.0-beta.1 -> beta
            gh release create @a
          }
